<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RishteClub Matrimony</title>
  <style>
    body {
      margin: 0;
      background-color: #4A121A;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      border-radius: 24px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(212, 175, 55, 0.3);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <meta http-equiv="refresh" content="0; url=https://www.rishteclub.com" />
</head>
<body>
  <img src="icon-192.png" alt="RishteClub Logo" class="logo" />
  <h1 style="margin: 0; font-size: 24px; color: #E9C377;">RishteClub Matrimony</h1>
  <p style="margin: 8px 0 0; color: #F3E5AB; font-size: 14px;">Connecting to secure portal...</p>
  <div class="spinner"></div>
</body>
</html>
